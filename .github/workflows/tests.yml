name: tests

on:
  push:
  pull_request:

# Install the package, run tests and execute the offline CPU example.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Offline CPU example (no market-data credentials)
        run: python -m rtcb_gym.demo --out results/demo
