[build-system]
requires = ["setuptools>=68"] 
build-backend = "setuptools.build_meta"

[project]
name = "rtcb-gym"
version = "0.2.0"
description = "Open battery-storage environment for the post-RTC+B ERCOT market: real-time and day-ahead (two-settlement)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "pyyaml>=6",
    # IANA time zones for zoneinfo. pandas 3 no longer pulls this in on Linux,
    # and newer system tz databases drop the "US/Central" alias.
    "tzdata",
]

[project.optional-dependencies]
data = ["gridstatusio>=0.10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["rtcb_gym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests also exercise repository scripts, outside the installed rtcb_gym package.
pythonpath = ["."]
