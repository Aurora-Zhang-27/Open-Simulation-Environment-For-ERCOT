[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtcb-gym"
version = "0.1.0"
description = "Open battery-storage market environment for the post-RTC+B ERCOT real-time market."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
data = ["gridstatusio>=0.10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["rtcb_gym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
